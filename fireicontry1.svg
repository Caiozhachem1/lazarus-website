<svg width="1337" height="836" viewBox="0 0 1337 836" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1337" height="836" fill="#141414"/>

<!-- Subtle grid -->
<g stroke="#1e1e1e" stroke-width="0.5">
    <line x1="0" y1="167" x2="1337" y2="167"/>
    <line x1="0" y1="334" x2="1337" y2="334"/>
    <line x1="0" y1="501" x2="1337" y2="501"/>
    <line x1="0" y1="668" x2="1337" y2="668"/>
    <line x1="267" y1="0" x2="267" y2="836"/>
    <line x1="534" y1="0" x2="534" y2="836"/>
    <line x1="801" y1="0" x2="801" y2="836"/>
    <line x1="1068" y1="0" x2="1068" y2="836"/>
</g>

<!-- Background contour lines -->
<path d="M 0 620 Q 350 560 650 700 T 1337 500" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M 0 250 Q 400 100 800 300 T 1337 160" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Dashed connection line: sensor → fire -->
<line x1="920" y1="230" x2="520" y2="390" stroke="#c59e5e" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.45"/>

<!-- Animated smoke/gas particles: fire → sensor -->
<g fill="#444">
    <circle r="4" opacity="0">
        <animate attributeName="cx" values="440;900" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="430;240" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4;50" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.3;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" opacity="0">
        <animate attributeName="cx" values="440;900" dur="5s" begin="1.67s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="430;240" dur="5s" begin="1.67s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4;50" dur="5s" begin="1.67s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.3;0" dur="5s" begin="1.67s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" opacity="0">
        <animate attributeName="cx" values="440;900" dur="5s" begin="3.33s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="430;240" dur="5s" begin="3.33s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4;50" dur="5s" begin="3.33s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.3;0" dur="5s" begin="3.33s" repeatCount="indefinite"/>
    </circle>
</g>

<!-- Detection zone -->
<rect x="330" y="280" width="250" height="290" fill="#FF0000" fill-opacity="0.02"/>
<rect x="330.1" y="280.1" width="249.8" height="289.8" stroke="#832B2B" stroke-opacity="0.8" stroke-width="0.2" stroke-linejoin="round"/>

<!-- Corner brackets (4px, matching intrusion) -->
<line x1="380" y1="280" x2="330" y2="280" stroke="#842C2C" stroke-width="4"/>
<line x1="332" y1="280" x2="332" y2="330" stroke="#842C2C" stroke-width="4"/>

<line x1="580" y1="280" x2="530" y2="280" stroke="#842C2C" stroke-width="4"/>
<line x1="578" y1="280" x2="578" y2="330" stroke="#842C2C" stroke-width="4"/>

<line x1="332" y1="520" x2="332" y2="570" stroke="#842C2C" stroke-width="4"/>
<line x1="330" y1="568" x2="380" y2="568" stroke="#842C2C" stroke-width="4"/>

<line x1="578" y1="520" x2="578" y2="570" stroke="#842C2C" stroke-width="4"/>
<line x1="530" y1="568" x2="580" y2="568" stroke="#842C2C" stroke-width="4"/>

<!-- Tick marks -->
<line x1="455" y1="274" x2="455" y2="280" stroke="#862C2C" stroke-width="1.3"/>
<line x1="455" y1="568" x2="455" y2="574" stroke="#862C2C" stroke-width="1.3"/>
<line x1="324" y1="424" x2="330" y2="424" stroke="#862C2C" stroke-width="1.3"/>
<line x1="580" y1="424" x2="586" y2="424" stroke="#862C2C" stroke-width="1.3"/>

<!-- Fire flame (outer) -->
<g transform="translate(455, 415)">
    <path d="M 0 -50 C 30 -22 42 0 42 24 C 42 42 22 52 0 52 C -22 52 -42 42 -42 24 C -42 0 -22 -28 0 -50 Z"
          fill="none" stroke="#d64933" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 0 -14 C 14 0 20 10 20 24 C 20 38 10 42 0 42 C -10 42 -20 38 -20 24 C -20 10 -10 -4 0 -14 Z"
          fill="none" stroke="#d64933" stroke-width="2" stroke-linejoin="round" opacity="0.6"/>
    <circle cx="0" cy="14" r="28" fill="#d64933" opacity="0.06">
        <animate attributeName="r" values="24;36;24" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.04;0.1;0.04" dur="1.8s" repeatCount="indefinite"/>
    </circle>
</g>

<!-- Callout line from detection box to callout box -->
<line x1="580" y1="390" x2="640" y2="340" stroke="#842C2C" stroke-width="1"/>

<!-- Callout box (matching intrusion size/style) -->
<rect x="640" y="310" width="388" height="170" rx="4.5" fill="#211717" stroke="#842C2C"/>
<text x="672" y="362" fill="#A53231" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3">IGNITION DETECTED</text>
<text x="672" y="400" fill="#7B7575" font-family="monospace" font-size="19" letter-spacing="1">S 4.406223°, W 64.819081°</text>
<text x="672" y="435" fill="#7B7575" font-family="monospace" font-size="19" letter-spacing="1">CO 420ppm · TEMP 380°C</text>

<!-- Sensor node -->
<g transform="translate(950, 220)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#c59e5e" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#c59e5e"/>
    <text x="28" y="-8" fill="#c59e5e" font-family="monospace" font-size="16" letter-spacing="1.5">SENSOR-04</text>
    <text x="28" y="14" fill="#666" font-family="monospace" font-size="12">GAS / AIR QUALITY</text>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#c59e5e" stroke-width="1.5">
        <animate attributeName="r" values="18;55" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
</g>

<!-- Bottom status bar (matching intrusion style) -->
<line y1="776" x2="1337" y2="776" stroke="#7B7575" stroke-opacity="0.35" stroke-width="2"/>
<text x="40" y="808" fill="#7B7575" font-family="monospace" font-size="16" letter-spacing="1.5" opacity="0.6">S-01  NORTH RIDGE</text>
<text x="1130" y="808" fill="#7B7575" font-family="monospace" font-size="16" letter-spacing="1.5" opacity="0.6">02:41:17</text>
<circle cx="1272" cy="808" r="9" fill="#6F2726">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
</circle>
</svg>
